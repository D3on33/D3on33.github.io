<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FBF9F4"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#5D3FD3"/>

  <!-- Grid lines (subtle) -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="#E8E4DA" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#E8E4DA" stroke-width="1" opacity="0.4"/>

  <!-- Eyebrow label -->
  <text x="108" y="154" font-family="'DM Mono', 'Courier New', monospace" font-size="11" letter-spacing="4" fill="#9590A2" text-transform="uppercase">SENIOR UX DESIGNER</text>

  <!-- Name — large italic serif -->
  <text x="108" y="278" font-family="'Instrument Serif', Georgia, serif" font-size="88" font-style="italic" letter-spacing="-3" fill="#1C1A22">Darshan Munkur</text>

  <!-- Divider line -->
  <line x1="108" y1="310" x2="480" y2="310" stroke="#5D3FD3" stroke-width="1.5"/>

  <!-- Tagline line 1 -->
  <text x="108" y="368" font-family="'Instrument Serif', Georgia, serif" font-size="26" letter-spacing="-0.5" fill="#3A3644">Designing complex systems for the</text>
  <!-- Tagline line 2 — italic accent -->
  <text x="108" y="408" font-family="'Instrument Serif', Georgia, serif" font-size="26" font-style="italic" letter-spacing="-0.5" fill="#5D3FD3">people inside them.</text>

  <!-- Bottom meta row -->
  <text x="108" y="560" font-family="'DM Mono', 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#9590A2">DARSHANMUNKUR.COM</text>

  <!-- Accent dot cluster top-right -->
  <circle cx="1094" cy="100" r="5" fill="#5D3FD3" opacity="0.25"/>
  <circle cx="1114" cy="100" r="5" fill="#5D3FD3" opacity="0.55"/>
  <circle cx="1134" cy="100" r="5" fill="#5D3FD3"/>

  <!-- Small grid stamp -->
  <rect x="1094" y="480" width="80" height="80" fill="none" stroke="#E8E4DA" stroke-width="1"/>
  <rect x="1114" y="480" width="40" height="80" fill="none" stroke="#E8E4DA" stroke-width="1"/>
  <rect x="1094" y="520" width="80" height="1" fill="#E8E4DA"/>
</svg>
